# Minimal Supabase local config. `supabase init` normally writes a much
# larger version of this file; we only need enough for `supabase functions`
# to work against the linked remote project.

project_id = "nutrisnap"

[functions.coach-chat]
verify_jwt = true

[functions.scan-analyze]
verify_jwt = true

[functions.estimate-nutrition]
verify_jwt = true

[functions.treat-suggestions]
verify_jwt = true
